name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      # Required by apps/web/.env.schema even though the quiz never reads it
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || 'https://example.invalid' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:web

      - name: Verify SPA artifact
        run: |
          test -f apps/web/build/client/index.html
          test -f apps/web/build/client/_redirects
          test ! -d apps/web/build/server

      - name: Create Pages project
        run: pnpm exec wrangler pages project create mongo-query-quiz --production-branch main
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy --branch main
